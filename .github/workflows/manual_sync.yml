name: 自动同步项目列表

on:
  workflow_dispatch:
  repository_dispatch:
    types: [org-webhook]

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-data:
    name: 同步项目数据
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      has_changes: ${{ steps.check.outputs.changed }}
      commit_sha: ${{ steps.commit.outputs.sha }}
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 获取数据并更新 config.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_NAME: CF-Works
        run: |
          echo "📡 正在获取组织仓库列表..."
          export REPOS_JSON=$(gh repo list $ORG_NAME --visibility=public --json name,url,description,homepageUrl --limit 100)
          
          echo "🔄 更新 config.js..."
          node -e "
          try {
            const fs = require('fs');
            const repos = JSON.parse(process.env.REPOS_JSON);
            const owner = process.env.ORG_NAME;

            const newProjects = repos
              .filter(r => r.name !== '.github' && r.name !== owner)
              .map(r => {
                const hasWebsite = r.homepageUrl && r.homepageUrl.trim() !== '';
                const desc = r.description || '暂无项目描述';
                if (hasWebsite) {
                  return {
                    title: r.name,
                    links: [
                      { url: r.homepageUrl, display: r.homepageUrl.replace(/^https?:\/\//, '').replace(/\/$/, '') },
                      { url: r.url, display: r.url.replace('https://github.com/', '') }
                    ],
                    description: desc
                  };
                } else {
                  return {
                    title: r.name,
                    url: r.url,
                    display: r.url.replace('https://github.com/', ''),
                    description: desc
                  };
                }
              });

            const path = 'config.js';
            let content = fs.readFileSync(path, 'utf8');
            const jsonPart = content.replace(/export\s+const\s+config\s+=\s+/, '').replace(/;\s*$/, '');
            const configObj = JSON.parse(jsonPart);

            configObj.projects = newProjects;

            const finalContent = 'export const config = ' + JSON.stringify(configObj, null, 2) + ';';
            fs.writeFileSync(path, finalContent);
            console.log('✅ 项目列表同步完成，共 ' + newProjects.length + ' 个项目');
          } catch (err) {
            console.error('❌ 处理失败:', err.message);
            process.exit(1);
          }
          "

      - name: 检查是否有变更
        id: check
        run: |
          git add config.js
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "📌 config.js 无变化，跳过部署"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ config.js 已更新"
          fi

      - name: 提交并推送
        id: commit
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 提交前先拉取最新代码（防止并发冲突）
          git pull --rebase origin ${{ github.ref_name }} || true
          
          git commit -m "chore: 自动更新项目列表 [skip ci]"
          git push
          
          # 输出新的 commit SHA
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "🚀 已推送更新: $(git rev-parse --short HEAD)"

  deploy-pages:
    name: 部署到 GitHub Pages
    needs: sync-data
    if: needs.sync-data.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: 检出最新代码
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync-data.outputs.commit_sha }}

      - name: 上传到 Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 执行部署
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 部署完成
        run: |
          echo "✅ 部署成功"
          echo "🌐 访问地址: ${{ steps.deployment.outputs.page_url }}"