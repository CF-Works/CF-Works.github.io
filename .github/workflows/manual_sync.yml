name: 自动同步项目列表

on:
  workflow_dispatch:
  repository_dispatch:
    types: [org-webhook]

# 核心改进：防止并发导致的 git push 冲突
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 保证 git push 顺畅

      - name: 获取数据并局部更新 config.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 明确指定组织名，确保 Webhook 触发时上下文准确
          ORG_NAME: "CF-Works" 
        run: |
          export REPOS_JSON=$(gh repo list $ORG_NAME --visibility=public --json name,url,description,homepageUrl --limit 100)
          
          # 这里是你原封不动的 Node 逻辑
          node -e "
          try {
            const fs = require('fs');
            const repos = JSON.parse(process.env.REPOS_JSON);
            const owner = process.env.ORG_NAME;

            const newProjects = repos
              .filter(r => r.name !== '.github' && r.name !== owner)
              .map(r => {
                const hasWebsite = r.homepageUrl && r.homepageUrl.trim() !== '';
                const desc = r.description || '暂无项目描述';
                if (hasWebsite) {
                  return {
                    title: r.name,
                    links: [
                      { url: r.homepageUrl, display: r.homepageUrl.replace(/^https?:\/\//, '').replace(/\/$/, '') },
                      { url: r.url, display: r.url.replace('https://github.com/', '') }
                    ],
                    description: desc
                  };
                } else {
                  return {
                    title: r.name,
                    url: r.url,
                    display: r.url.replace('https://github.com/', ''),
                    description: desc
                  };
                }
              });

            const path = 'config.js';
            let content = fs.readFileSync(path, 'utf8');
            const jsonPart = content.replace(/export\s+const\s+config\s+=\s+/, '').replace(/;\s*$/, '');
            const configObj = JSON.parse(jsonPart);

            configObj.projects = newProjects;

            const finalContent = 'export const config = ' + JSON.stringify(configObj, null, 2) + ';';
            fs.writeFileSync(path, finalContent);
            console.log('✅ 项目列表同步完成');
          } catch (err) {
            console.error('❌ 处理失败:', err.message);
            process.exit(1);
          }
          "

      - name: 提交并推送
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add config.js
          # 加上 [skip ci] 防止死循环触发，并检查是否有变化
          if git commit -m "auto: 仅同步项目数据 [skip ci]"; then
            git push
          else
            echo "No changes to commit"
          fi

      - name: 部署到 Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 执行部署
        uses: actions/deploy-pages@v4
