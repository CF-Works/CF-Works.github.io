name: 自动同步项目列表

on:
  workflow_dispatch:
  repository_dispatch:
    types: [org-webhook]

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-data:
    name: 同步项目数据
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      has_changes: ${{ steps.check.outputs.changed }}
      commit_sha: ${{ steps.commit.outputs.sha }}
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 同步项目列表到 config.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_NAME: CF-Works
        run: |
          echo "📡 正在获取组织仓库列表..."
          REPOS_JSON=$(gh repo list "$ORG_NAME" \
            --visibility public \
            --json name,url,description,homepageUrl \
            --limit 100)
          
          echo "🔄 更新 config.js..."
          node << 'EOF'
          const fs = require('fs');
          const repos = JSON.parse(process.env.REPOS_JSON);
          const owner = process.env.ORG_NAME;

          const newProjects = repos
            .filter(r => r.name !== '.github' && r.name !== owner)
            .map(r => {
              const baseObj = {
                title: r.name,
                description: r.description || '暂无项目描述'
              };

              if (r.homepageUrl?.trim()) {
                return {
                  ...baseObj,
                  links: [
                    { 
                      url: r.homepageUrl, 
                      display: r.homepageUrl.replace(/^https?:\/\//, '').replace(/\/$/, '') 
                    },
                    { 
                      url: r.url, 
                      display: r.url.replace('https://github.com/', '') 
                    }
                  ]
                };
              }
              
              return {
                ...baseObj,
                url: r.url,
                display: r.url.replace('https://github.com/', '')
              };
            });

          const configPath = 'config.js';
          const content = fs.readFileSync(configPath, 'utf8');
          const configObj = JSON.parse(
            content.replace(/export\s+const\s+config\s+=\s+/, '').replace(/;\s*$/, '')
          );

          configObj.projects = newProjects;

          fs.writeFileSync(
            configPath, 
            `export const config = ${JSON.stringify(configObj, null, 2)};`
          );

          console.log(`✅ 已同步 ${newProjects.length} 个项目`);
          EOF

      - name: 检查是否有变更
        id: check
        run: |
          git add config.js
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "📌 config.js 无变化，跳过部署"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ config.js 已更新"
          fi

      - name: 提交变更
        id: commit
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 提交前先拉取（防止并发冲突）
          git pull --rebase origin ${{ github.ref_name }} || true
          
          git commit -m "chore: 自动更新项目列表 [skip ci]"
          git push
          
          # 输出新的 commit SHA 用于部署
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "🚀 已推送 commit: $(git rev-parse --short HEAD)"

  deploy-pages:
    name: 部署到 GitHub Pages
    needs: sync-data
    if: needs.sync-data.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    
    # Pages 部署专用环境
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: 检出最新代码
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync-data.outputs.commit_sha }}  # 使用刚才的提交

      - name: 上传到 Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 执行部署
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 部署完成
        run: |
          echo "✅ 部署成功"
          echo "🌐 访问地址: ${{ steps.deployment.outputs.page_url }}"