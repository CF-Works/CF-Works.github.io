name: 自动同步并构建网页

on:
  workflow_dispatch: # 支持手动点击运行
  schedule:
    - cron: '0 * * * *' # 每小时自动巡逻同步一次

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    # 授予权限：写仓库内容、写 Pages、写 ID 令牌
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 获取数据并重构 config.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_NAME: ${{ github.repository_owner }}
        run: |
          # 1. 使用 GitHub CLI 获取组织内所有公开仓库
          export REPOS_JSON=$(gh repo list $ORG_NAME --visibility=public --json name,url,description,homepageUrl --limit 100)
          
          # 2. 运行 Node 脚本全量重写 config.js
          node -e "
          try {
            const fs = require('fs');
            const repos = JSON.parse(process.env.REPOS_JSON);
            const owner = process.env.ORG_NAME;

            // 转换数据逻辑
            const projects = repos
              .filter(r => r.name !== '.github' && r.name !== owner)
              .map(r => {
                const hasWebsite = r.homepageUrl && r.homepageUrl.trim() !== '';
                const desc = r.description || '暂无项目描述';
                
                if (hasWebsite) {
                  // 模式 A：有 Website，生成 links 数组
                  return {
                    title: r.name,
                    links: [
                      { url: r.homepageUrl, display: r.homepageUrl.replace(/^https?:\/\//, '').replace(/\/$/, '') },
                      { url: r.url, display: r.url.replace('https://github.com/', '') }
                    ],
                    description: desc
                  };
                } else {
                  // 模式 B：无 Website，生成单 url
                  return {
                    title: r.name,
                    url: r.url,
                    display: r.url.replace('https://github.com/', ''),
                    description: desc
                  };
                }
              });

            // 直接定义完整的配置模板，确保格式百分之百正确
            const configTemplate = {
              siteTitle: 'CF-Works组织の项目集',
              siteSubtitle: 'cloudflare项目',
              githubUsername: 'cf-works',
              copyrightStartYear: '2025',
              siteInfo: {
                enabled: true,
                title: '关于这个页面',
                paragraphs: ['存放一些CloudFlare成熟的项目']
              },
              projects: projects
            };

            // 写入文件，采用 ESM 格式 (export const config = ...)
            const fileContent = 'export const config = ' + JSON.stringify(configTemplate, null, 2) + ';';
            fs.writeFileSync('config.js', fileContent);
            console.log('✅ config.js 格式重构成功，共同步 ' + projects.length + ' 个项目');
          } catch (err) {
            console.error('❌ 执行失败:', err.message);
            process.exit(1);
          }
          "

      - name: 提交并推送源码
        # 这一步会将修复后的 config.js 存回 Git 仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add config.js
          git commit -m "auto: 重构并同步项目列表" || exit 0
          git push

      - name: 设置 Pages
        uses: actions/configure-pages@v4
        
      - name: 上传网页构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # 您的 index.html 在根目录

      - name: 部署至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
