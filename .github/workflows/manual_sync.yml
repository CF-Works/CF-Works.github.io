name: 自动同步组织项目

on:
  workflow_dispatch: # 手动运行按钮
  schedule:
    - cron: '0 * * * *' # 每小时整点运行一次

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 获取数据并更新
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_NAME: ${{ github.repository_owner }}
        run: |
          # 1. 获取组织仓库列表
          export REPOS_JSON=$(gh repo list $ORG_NAME --visibility=public --json name,url,description,homepageUrl --limit 100)
          
          # 2. 执行 Node.js 脚本进行“填空式”替换
          node -e "
            const fs = require('fs');
            const repos = JSON.parse(process.env.REPOS_JSON);
            const owner = process.env.ORG_NAME;

            // 过滤并处理项目数据
            const projects = repos
              .filter(r => r.name !== '.github' && r.name !== owner)
              .map(r => {
                const hasWebsite = r.homepageUrl && r.homepageUrl.trim() !== '';
                const desc = r.description || '暂无项目描述';
                if (hasWebsite) {
                  return {
                    title: r.name,
                    links: [
                      { url: r.homepageUrl, display: r.homepageUrl.replace(/^https?:\/\//, '').replace(/\/$/, '') },
                      { url: r.url, display: r.url.replace('https://github.com/', '') }
                    ],
                    description: desc
                  };
                } else {
                  return {
                    title: r.name,
                    url: r.url,
                    display: r.url.replace('https://github.com/', ''),
                    description: desc
                  };
                }
              });

            // 读取并替换 config.js 中的 projects 数组
            const path = 'config.js';
            let content = fs.readFileSync(path, 'utf8');
            const projectsString = JSON.stringify(projects, null, 2);
            
            // 匹配 projects: [ ... ] 结构进行替换
            const updatedContent = content.replace(/projects: \[\s*[\s\S]*?\s*\]/, 'projects: ' + projectsString);
            
            fs.writeFileSync(path, updatedContent);
          "

      - name: 提交更改
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add config.js
          git commit -m "auto: 定时同步项目列表" || exit 0
          git push
