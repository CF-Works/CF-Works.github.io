name: 自动同步项目列表

on:
  workflow_dispatch:
  repository_dispatch:
    types: [org-webhook]
  #schedule:
    #- cron: '0 * * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 获取数据并局部更新 config.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_NAME: ${{ github.repository_owner }}
        run: |
          export REPOS_JSON=$(gh repo list $ORG_NAME --visibility=public --json name,url,description,homepageUrl --limit 100)
          
          node -e "
          try {
            const fs = require('fs');
            const repos = JSON.parse(process.env.REPOS_JSON);
            const owner = process.env.ORG_NAME;

            // 1. 准备新的项目数组
            const newProjects = repos
              .filter(r => r.name !== '.github' && r.name !== owner)
              .map(r => {
                const hasWebsite = r.homepageUrl && r.homepageUrl.trim() !== '';
                const desc = r.description || '暂无项目描述';
                if (hasWebsite) {
                  return {
                    title: r.name,
                    links: [
                      { url: r.homepageUrl, display: r.homepageUrl.replace(/^https?:\/\//, '').replace(/\/$/, '') },
                      { url: r.url, display: r.url.replace('https://github.com/', '') }
                    ],
                    description: desc
                  };
                } else {
                  return {
                    title: r.name,
                    url: r.url,
                    display: r.url.replace('https://github.com/', ''),
                    description: desc
                  };
                }
              });

            // 2. 读取当前文件内容
            const path = 'config.js';
            let content = fs.readFileSync(path, 'utf8');

            // 3. 提取对象 (兼容 export const config = { ... })
            // 将内容转换为可解析的 JSON 字符串
            const jsonPart = content.replace(/export\s+const\s+config\s+=\s+/, '').replace(/;\s*$/, '');
            const configObj = JSON.parse(jsonPart);

            // 4. 只替换 projects 数组
            configObj.projects = newProjects;

            // 5. 写回文件
            const finalContent = 'export const config = ' + JSON.stringify(configObj, null, 2) + ';';
            fs.writeFileSync(path, finalContent);
            console.log('✅ 项目列表同步完成，其余手动配置已保留。');
          } catch (err) {
            console.error('❌ 处理失败，请检查 config.js 格式是否为标准 JSON 对象:', err.message);
            process.exit(1);
          }
          "

      - name: 提交并推送
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add config.js
          git commit -m "auto: 仅同步项目数据" || exit 0
          git push

      - name: 部署到 Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      
      - name: 部署
        uses: actions/deploy-pages@v4
