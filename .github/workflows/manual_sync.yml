name: 自动同步并构建网页

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # 每小时运行一次

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write      # 赋予部署 Pages 的权限
      id-token: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 获取数据并更新 config.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_NAME: ${{ github.repository_owner }}
        run: |
          export REPOS_JSON=$(gh repo list $ORG_NAME --visibility=public --json name,url,description,homepageUrl --limit 100)
          
node -e "
try {
  const fs = require('fs');
  const repos = JSON.parse(process.env.REPOS_JSON);
  const owner = process.env.ORG_NAME;

  // 1. 处理项目数据逻辑 (保持你要求的 Website 判断)
  const projects = repos
    .filter(r => r.name !== '.github' && r.name !== owner)
    .map(r => {
      const hasWebsite = r.homepageUrl && r.homepageUrl.trim() !== '';
      const desc = r.description || '暂无项目描述';
      if (hasWebsite) {
        return {
          title: r.name,
          links: [
            { url: r.homepageUrl, display: r.homepageUrl.replace(/^https?:\/\//, '').replace(/\/$/, '') },
            { url: r.url, display: r.url.replace('https://github.com/', '') }
          ],
          description: desc
        };
      } else {
        return {
          title: r.name,
          url: r.url,
          display: r.url.replace('https://github.com/', ''),
          description: desc
        };
      }
    });

  // 2. 直接定义完整的配置模板
  // 这样你改这里的文字，生成的 config.js 就会永远保持整洁
  const configTemplate = {
    siteTitle: 'CF-Works组织の项目集',
    siteSubtitle: 'cloudflare项目',
    githubUsername: 'cf-works',
    copyrightStartYear: '2025',
    siteInfo: {
      enabled: true,
      title: '关于这个页面',
      paragraphs: ['存放一些CloudFlare成熟的项目']
    },
    projects: projects // 注入刚刚生成的数组
  };

  // 3. 写入文件，使用 ESM 导出格式
  const fileContent = 'export const config = ' + JSON.stringify(configTemplate, null, 2) + ';';
  fs.writeFileSync('config.js', fileContent);
  console.log('✅ config.js 已彻底重构并同步完成！');
} catch (err) {
  console.error(err);
  process.exit(1);
}
"

      - name: 提交并推送到仓库
        # 这一步保证了你的仓库里能看到最新的 config.js
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add config.js
          git commit -m "auto: 同步项目列表并触发构建" || exit 0
          git push

      # --- 如果你的网页需要 npm 构建，请取消下面部分的注释 ---
      # - name: 安装依赖并构建
      #   run: |
      #     npm install
      #     npm run build
      
      # --- 触发 GitHub Pages 重新部署 ---
      # 即使是纯静态页面，显式调用这个 action 也能确保 CDN 刷新
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # 如果你有构建目录（如 ./dist），请改为 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
