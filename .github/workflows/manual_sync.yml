name: 同步项目集

on:
  workflow_dispatch: # 保留手动触发按钮，方便调试
  repository_dispatch:
    types: [org_update] # 接收来自 .github 仓库的信号了

  # 如果你想每天自动运行一次，可以取消下面两行的注释
  # schedule:
  #   - cron: '0 0 * * *'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 获取并处理仓库数据
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_NAME: ${{ github.repository_owner }}
        run: |
          export REPOS_JSON=$(gh repo list $ORG_NAME --visibility=public --json name,url,description,homepageUrl --limit 100)
          
          node -e "
            try {
              const fs = require('fs');
              const repos = JSON.parse(process.env.REPOS_JSON);
              const owner = process.env.ORG_NAME;

              const projects = repos
                .filter(r => r.name !== '.github' && r.name !== owner)
                .map(r => {
                  const hasWebsite = r.homepageUrl && r.homepageUrl.trim() !== '';
                  const description = r.description || '暂无项目描述';
                  
                  if (hasWebsite) {
                    // 模式 A: 有 Website，使用 links 数组
                    return {
                      title: r.name,
                      links: [
                        { 
                          url: r.homepageUrl, 
                          display: r.homepageUrl.replace(/^https?:\/\//, '').replace(/\/$/, '') 
                        },
                        { 
                          url: r.url, 
                          display: r.url.replace('https://github.com/', '') 
                        }
                      ],
                      description: description
                    };
                  } else {
                    // 模式 B: 无 Website，直接使用 url 和 display
                    return {
                      title: r.name,
                      url: r.url,
                      display: r.url.replace('https://github.com/', ''),
                      description: description
                    };
                  }
                });

              const path = 'config.js';
              let content = fs.readFileSync(path, 'utf8');
              const projectsString = JSON.stringify(projects, null, 2);
              
              // 替换 config.js 中的 projects 数组内容
              content = content.replace(/projects: \[\s*[\s\S]*?\s*\]/, 'projects: ' + projectsString);
              
              fs.writeFileSync(path, content);
              console.log('✅ 成功同步 ' + projects.length + ' 个项目（根据 Website 自动切换结构）');
            } catch (err) {
              console.error(err);
              process.exit(1);
            }
          "

      - name: 提交更新
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add config.js
          git commit -m "auto: 按照 Website 状态动态同步项目" || exit 0
          git push
