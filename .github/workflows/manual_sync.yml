name: 自动同步项目列表

on:
  workflow_dispatch:
  repository_dispatch:
    types: [org-webhook]

# 防止并发任务冲突（当短时间内连续创建/删除仓库时）
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 获取完整历史以确保推送成功
          fetch-depth: 0

      - name: 获取数据并局部更新 config.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 建议直接指定组织名，防止 context 漂移
          ORG_NAME: "CF-Works" 
        run: |
          # 获取公开仓库列表
          export REPOS_JSON=$(gh repo list $ORG_NAME --visibility=public --json name,url,description,homepageUrl,stargazersCount --limit 100)
          
          node -e "
          try {
            const fs = require('fs');
            const repos = JSON.parse(process.env.REPOS_JSON);
            const owner = process.env.ORG_NAME;

            // 1. 过滤并排序（按星标数降序，可按需修改）
            const newProjects = repos
              .filter(r => r.name !== '.github' && r.name !== owner && r.name !== owner.toLowerCase() + '.github.io')
              .sort((a, b) => b.stargazersCount - a.stargazersCount)
              .map(r => {
                const hasWebsite = r.homepageUrl && r.homepageUrl.trim() !== '';
                const desc = r.description || '暂无项目描述';
                if (hasWebsite) {
                  return {
                    title: r.name,
                    links: [
                      { url: r.homepageUrl, display: r.homepageUrl.replace(/^https?:\/\//, '').replace(/\/$/, '') },
                      { url: r.url, display: r.url.replace('https://github.com/', '') }
                    ],
                    description: desc
                  };
                } else {
                  return {
                    title: r.name,
                    url: r.url,
                    display: r.url.replace('https://github.com/', ''),
                    description: desc
                  };
                }
              });

            const path = 'config.js';
            let content = fs.readFileSync(path, 'utf8');

            // 2. 增强型正则：匹配 export const config = { ... };
            // 这种方式比 JSON.parse 更安全，能保留文件中的注释和格式
            const regex = /(export\s+const\s+config\s+=\s+)(\{[\s\S]*?\})(\s*;?)/;
            const match = content.match(regex);
            
            if (match) {
              // 注意：这里由于你的 config.js 不是标准 JSON (可能有方法或末尾逗号)，
              // 我们通过构造对象再替换字符串的方式来确保 projects 被更新
              let configObj;
              try {
                // 尝试解析，如果失败则回退到简单的 key 替换
                configObj = eval('(' + match[2] + ')');
                configObj.projects = newProjects;
                const updatedConfig = JSON.stringify(configObj, null, 2);
                content = content.replace(regex, '$1' + updatedConfig + '$3');
              } catch(e) {
                // 如果 eval 失败（格式太复杂），则直接用正则替换 projects 数组部分
                const projectsRegex = /(projects:\s*\[)[\s\S]*?(\])/;
                content = content.replace(projectsRegex, '$1' + JSON.stringify(newProjects, null, 2).slice(1, -1) + '$2');
              }
            }

            fs.writeFileSync(path, content);
            console.log('✅ 项目列表同步完成');
          } catch (err) {
            console.error('❌ 处理失败:', err.message);
            process.exit(1);
          }
          "

      - name: 提交并推送
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add config.js
          if git commit -m "auto: 同步项目列表 [skip ci]"; then
            git push
          else
            echo "没有变化需要提交"
          fi

      - name: 上传 Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 部署到 Pages
        uses: actions/deploy-pages@v4
